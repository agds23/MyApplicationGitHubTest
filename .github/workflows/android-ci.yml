name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_CLI_VERSION: '1.0.16406183'
  ANDROID_PLATFORM_PACKAGE: 'platforms/android-37.0@2'
  ANDROID_BUILD_TOOLS_PACKAGE: 'build-tools/37.0.0'

jobs:
  build:
    name: Build, test and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25.0.4+1'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          cmdline-tools-version: '15859902' # Android SDK Command-line Tools 22.0
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install pinned Android CLI
        shell: bash
        run: |
          curl -fsSL https://dl.google.com/android/cli/latest/linux_x86_64/install_root.sh | sudo bash
          cli_version="$(android --version | tail -n 1 | tr -d '\r')"
          echo "Android CLI version: $cli_version"
          test "$cli_version" = "$ANDROID_CLI_VERSION"

      - name: Install Android 17 SDK packages
        shell: bash
        run: |
          android --sdk="$ANDROID_HOME" sdk install --canary \
            "$ANDROID_PLATFORM_PACKAGE" \
            "$ANDROID_BUILD_TOOLS_PACKAGE"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          add-job-summary: on-failure

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Run Android lint
        run: ./gradlew lint --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
